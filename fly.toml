# 备选：flyctl launch --no-deploy 之后 fly deploy
# 先执行：fly secrets set PUBLISH_TOKEN=你的token

app = "haohantian-digest"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TZ = "Asia/Shanghai"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"
